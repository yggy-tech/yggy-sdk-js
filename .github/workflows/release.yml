name: Release

# release-please keeps a release PR open with the version bump and changelog. Merging it tags
# the release and creates the GitHub release. The sync (yggy-tech/yggdrasil) describes each
# merged sync by its real commits, which is what the changelog is made of.
on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
